<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Karaoke Booking</title>
</head>
<body>
  <h1>Karaoke Booking</h1>

  <h2>Réservations</h2>
  <ul id="liste"></ul>

  <h2>Réserver</h2>
  <form id="formulaire">
    <select name="salon" required>
      <option>Salon Disco</option>
      <option>Salon Rock</option>
      <option>Salon Pop</option>
      <option>Salon Jazz</option>
    </select>
    <input name="jour" type="date" required>
    <input name="creneau" placeholder="20:00 - 22:00" required>
    <input name="nom" placeholder="Nom" required>
    <input name="places" type="number" min="1" max="12" placeholder="Places" required>
    <button>Réserver</button>
  </form>
  <p id="message"></p>

  <script>
    async function afficher() {
      const reponse = await fetch("/api/reservations");
      const liste = document.getElementById("liste");
      liste.innerHTML = "";
      if (!reponse.ok) {
        liste.textContent = "Base non connectée";
        return;
      }
      for (const r of await reponse.json()) {
        const li = document.createElement("li");
        li.textContent = `${r.jour} ${r.creneau} - ${r.salon} - ${r.nom} (${r.places} places) - reste ${r.restantes} places`;
        liste.appendChild(li);
      }
    }

    document.getElementById("formulaire").addEventListener("submit", async (e) => {
      e.preventDefault();
      const donnees = Object.fromEntries(new FormData(e.target));
      const reponse = await fetch("/api/reservations", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(donnees),
      });
      const message = document.getElementById("message");
      if (reponse.ok) {
        message.textContent = "";
        e.target.reset();
      } else {
        message.textContent = (await reponse.json()).erreur;
      }
      afficher();
    });

    afficher();
  </script>
</body>
</html>
